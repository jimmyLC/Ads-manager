openapi: 3.1.0
info:
  title: Ads-manager API
  version: 1.0.0
  description: |
    第一方廣告投放與管理 API。

    **兩組介面：**
    - `/v1/*` — 投放 API。僅供站方 server-to-server 呼叫（綁 127.0.0.1，不需認證）。
      素材與跳轉亦由此提供，由站方薄代理後以同源、中性命名路徑回應給瀏覽器。
    - `/api/admin/*` — 管理 API。供後台使用，需 session cookie；後台只綁 Tailscale，對外 403。

    **隱私：** 不接收也不儲存 IP 與原始 UA。`country` 由站方解析（Cloudflare `CF-IPCountry`）後傳入 ISO-2；
    `device` 由站方解析 UA 後傳入 `desktop|mobile|tablet|unknown` 桶。
servers:
  - url: http://127.0.0.1:9090
    description: 本機 ad 服務

tags:
  - name: delivery
    description: 投放 API（站方呼叫）
  - name: admin
    description: 管理 API（後台）

paths:
  /v1/serve:
    get:
      tags: [delivery]
      summary: 取得某版位的投放決策（並記一次曝光）
      parameters:
        - { name: site, in: query, required: true, schema: { type: string, enum: [javis, javid] } }
        - { name: slot, in: query, required: true, schema: { type: string } }
        - { name: country, in: query, required: false, schema: { type: string, default: XX }, description: ISO-2；未知用 XX }
        - { name: device, in: query, required: false, schema: { type: string, enum: [desktop, mobile, tablet, unknown], default: unknown } }
      responses:
        '200':
          description: 有廣告，或無合格廣告
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ServeResponse'
                  - $ref: '#/components/schemas/NoAdResponse'
        '404': { description: 版位不存在, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: 內部錯誤, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }

  /v1/asset/{assetId}:
    get:
      tags: [delivery]
      summary: 取得素材 bytes（站方代理後以同源路徑回應）
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
        - { name: t, in: query, required: true, schema: { type: string }, description: 短期 HMAC token（10 分鐘） }
      responses:
        '200':
          description: 圖片
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { description: token 無效或過期 }

  /v1/out/{creativeId}:
    get:
      tags: [delivery]
      summary: 點擊跳轉（記一次點擊後 302）
      parameters:
        - { name: creativeId, in: path, required: true, schema: { type: string } }
        - { name: d, in: query, required: false, schema: { type: string, enum: [desktop, mobile], default: desktop } }
        - { name: country, in: query, required: false, schema: { type: string } }
        - { name: device, in: query, required: false, schema: { type: string } }
        - { name: placement, in: query, required: false, schema: { type: string }, description: site:slot，未知則記 unknown }
      responses:
        '302': { description: 轉向資料庫中的目標網址 }
        '404': { description: 素材或連結不存在 }

  /v1/conv/{trackerId}.gif:
    get:
      tags: [delivery]
      summary: 轉換 pixel（記一次轉換）
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 1x1 透明 GIF, content: { image/gif: { schema: { type: string, format: binary } } } }
        '404': { description: tracker 不存在 }

  /v1/health:
    get:
      tags: [delivery]
      summary: 健康檢查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, db, version]
                properties:
                  ok: { type: boolean }
                  db: { type: string, enum: [ok, error] }
                  version: { type: string }
                  now: { type: string, format: date-time }

  /api/admin/ads:
    get:
      tags: [admin]
      summary: 廣告列表
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: site, in: query, schema: { type: string } }
        - { name: placement, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, paused, ended] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Ad' } } } } }
        '401': { description: 未登入 }
    post:
      tags: [admin]
      summary: 建立廣告（草稿）
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AdInput' } }
      responses:
        '201': { description: 建立成功, content: { application/json: { schema: { $ref: '#/components/schemas/Ad' } } } }
        '403': { description: 權限不足 }

  /api/admin/ads/{id}:
    get:
      tags: [admin]
      summary: 讀取廣告
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ad' } } } }
        '404': { description: 不存在 }
    patch:
      tags: [admin]
      summary: 更新廣告
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AdInput' } }
      responses:
        '200': { description: OK }
        '403': { description: 權限不足 }
    delete:
      tags: [admin]
      summary: 刪除廣告
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 已刪除 }
        '403': { description: 權限不足 }

  /api/admin/ads/{id}/assets:
    post:
      tags: [admin]
      summary: 上傳素材變體（尺寸與比例會被驗證）
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: placement_id, in: query, required: true, schema: { type: string } }
        - { name: variant, in: query, required: true, schema: { type: string, enum: [desktop, 'desktop@2x', mobile, 'mobile@2x'] } }
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } }
      responses:
        '201': { description: 上傳成功 }
        '400': { description: 尺寸/比例/格式不符 }
        '403': { description: 權限不足 }

  /api/admin/ads/{id}/publish:
    post:
      tags: [admin]
      summary: 上線（draft → active）
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409': { description: 素材未齊備 }

  /api/admin/ads/{id}/pause:
    post:
      tags: [admin]
      summary: 下架
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /api/admin/placements:
    get:
      tags: [admin]
      summary: 版位列表
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 建立版位
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: OK }

  /api/admin/targeting:
    get:
      tags: [admin]
      summary: 定向條件列表
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 新增定向條件
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: OK }

  /api/admin/trackers:
    get:
      tags: [admin]
      summary: 追蹤器列表
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 新增追蹤器
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: OK }

  /api/admin/stats:
    get:
      tags: [admin]
      summary: 報表
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: groupBy, in: query, required: false, schema: { type: string, default: day,campaign,placement }, description: '逗號分隔：day,campaign,creative,placement,country,device' }
        - { name: site, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /api/admin/stats.csv:
    get:
      tags: [admin]
      summary: 報表 CSV 匯出
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: groupBy, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV
          content:
            text/csv: { schema: { type: string } }

  /api/admin/users:
    post:
      tags: [admin]
      summary: 建立後台帳號（僅管理員）
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: OK }
        '403': { description: 權限不足 }

  /api/admin/audit:
    get:
      tags: [admin]
      summary: 稽核軌跡（僅管理員）
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ads_session

  schemas:
    ServeResponse:
      type: object
      required: [ok, ad]
      properties:
        ok: { type: boolean, const: true }
        ad:
          type: object
          required: [id, campaign_id, kind, name, alt, width, height, aspect, image, link]
          properties:
            id: { type: string }
            campaign_id: { type: string }
            kind: { type: string, enum: [image, native, html] }
            name: { type: string }
            alt: { type: string }
            width: { type: integer }
            height: { type: integer }
            aspect: { type: string, example: '16/5' }
            image:
              type: object
              properties:
                desktop: { $ref: '#/components/schemas/AssetRef' }
                mobile: { $ref: '#/components/schemas/AssetRef' }
            native:
              type: object
              nullable: true
              properties:
                headline: { type: string }
                body: { type: string }
                cta_label: { type: string }
                cta_url: { type: string, format: uri }
                logo_url: { type: string }
                thumb_url: { type: string }
            link:
              type: object
              properties:
                desktop: { type: string }
                mobile: { type: string }
            trackers:
              type: array
              items: { type: string }

    AssetRef:
      type: object
      required: [asset_id, url]
      properties:
        asset_id: { type: string }
        url: { type: string, description: '站方應改寫為自己的同源路徑' }

    NoAdResponse:
      type: object
      required: [ok, reason]
      properties:
        ok: { type: boolean, const: false }
        reason: { type: string, enum: [no_eligible_ad] }

    Error:
      type: object
      required: [ok, reason]
      properties:
        ok: { type: boolean, const: false }
        reason: { type: string, enum: [unknown_placement, internal_error, unauthorized] }

    Ad:
      type: object
      properties:
        id: { type: string }
        campaign_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, native, html] }
        status: { type: string, enum: [draft, active, paused] }
        alt_text: { type: string }
        headline: { type: string }
        body: { type: string }
        cta_label: { type: string }
        cta_url: { type: string }
        weight: { type: integer }
        starts_at: { type: integer, nullable: true }
        ends_at: { type: integer, nullable: true }
        daily_impression_cap: { type: integer, nullable: true }
        target_impression: { type: integer, nullable: true }
        target_click: { type: integer, nullable: true }
        placements: { type: array, items: { type: string } }
        assets: { type: array, items: { $ref: '#/components/schemas/AssetRef' } }

    AdInput:
      type: object
      properties:
        campaign_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [image, native, html] }
        status: { type: string, enum: [draft, active, paused] }
        alt_text: { type: string }
        headline: { type: string }
        body: { type: string }
        cta_label: { type: string }
        cta_url: { type: string }
        weight: { type: integer, minimum: 1, maximum: 10 }
        starts_at: { type: integer, nullable: true }
        ends_at: { type: integer, nullable: true }
        daily_impression_cap: { type: integer, nullable: true }
        target_impression: { type: integer, nullable: true }
        target_click: { type: integer, nullable: true }
        placements: { type: array, items: { type: string } }
        targeting:
          type: array
          items:
            type: object
            required: [dimension, operator, value]
            properties:
              dimension: { type: string, enum: [country, placement, device, hour, weekday, path] }
              operator: { type: string, enum: [in, not_in, equals] }
              value: { type: string, description: '逗號分隔；hour=0..23、weekday=1..7(ISO,1=週一)、path=路徑前綴' }
